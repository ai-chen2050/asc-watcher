    if (origPush) {
      history.pushState = function(){
        var ret = origPush.apply(this, arguments);
        trackPageView();
        return ret;
      };
    }
    var origReplace = history.replaceState;
    if (origReplace) {

    window.addEventListener('hashchange', trackPageView);
  })();
